<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summarizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <!-- Animated -->
    <div class="bg-layer" aria-hidden="true">
        <span class="bg-glow glow-1"></span>
        <span class="bg-glow glow-2"></span>
        <span class="bg-dot" style="left:43%;top:22%;--s:5px;--d:19s;--dl:-1s;--dx:-30px"></span>
        <span class="bg-dot" style="left:70%;top:15%;--s:4px;--d:18s;--dl:-1s;--dx:-18px"></span>
        <span class="bg-dot" style="left:6%;top:14%;--s:5px;--d:15s;--dl:-2s;--dx:-18px"></span>
        <span class="bg-dot" style="left:13%;top:73%;--s:5px;--d:9s;--dl:-3s;--dx:-18px"></span>
        <span class="bg-dot" style="left:82%;top:83%;--s:6px;--d:9s;--dl:-12s;--dx:-30px"></span>
        <span class="bg-dot" style="left:30%;top:8%;--s:6px;--d:11s;--dl:-9s;--dx:30px"></span>
        <span class="bg-dot" style="left:20%;top:72%;--s:3px;--d:18s;--dl:-9s;--dx:-18px"></span>
        <span class="bg-dot" style="left:15%;top:77%;--s:6px;--d:19s;--dl:-6s;--dx:18px"></span>
        <span class="bg-dot" style="left:14%;top:73%;--s:3px;--d:18s;--dl:-1s;--dx:-18px"></span>
        <span class="bg-dot" style="left:65%;top:90%;--s:6px;--d:15s;--dl:-10s;--dx:30px"></span>
        <span class="bg-dot" style="left:76%;top:61%;--s:4px;--d:13s;--dl:-7s;--dx:-18px"></span>
        <span class="bg-dot" style="left:91%;top:34%;--s:3px;--d:18s;--dl:-9s;--dx:30px"></span>
        <span class="bg-dot" style="left:45%;top:60%;--s:4px;--d:18s;--dl:-2s;--dx:-30px"></span>
        <span class="bg-dot" style="left:67%;top:56%;--s:3px;--d:14s;--dl:-4s;--dx:30px"></span>
        <span class="bg-dot" style="left:55%;top:8%;--s:3px;--d:17s;--dl:-10s;--dx:18px"></span>
        <span class="bg-dot" style="left:90%;top:47%;--s:6px;--d:16s;--dl:-14s;--dx:-30px"></span>
        <span class="bg-dot" style="left:13%;top:37%;--s:5px;--d:20s;--dl:-2s;--dx:-30px"></span>
        <span class="bg-dot" style="left:95%;top:92%;--s:4px;--d:19s;--dl:-14s;--dx:18px"></span>
        <span class="bg-dot" style="left:93%;top:52%;--s:4px;--d:9s;--dl:-14s;--dx:18px"></span>
        <span class="bg-dot" style="left:23%;top:81%;--s:3px;--d:16s;--dl:-1s;--dx:-18px"></span>
        <span class="bg-dot" style="left:38%;top:19%;--s:3px;--d:15s;--dl:-12s;--dx:30px"></span>
        <span class="bg-dot" style="left:12%;top:24%;--s:5px;--d:15s;--dl:-8s;--dx:-18px"></span>
        <span class="bg-dot" style="left:57%;top:73%;--s:4px;--d:20s;--dl:-13s;--dx:18px"></span>
        <span class="bg-dot" style="left:89%;top:51%;--s:3px;--d:11s;--dl:-2s;--dx:-18px"></span>
        <span class="bg-dot" style="left:21%;top:32%;--s:3px;--d:9s;--dl:-15s;--dx:-18px"></span>
        <span class="bg-dot" style="left:35%;top:39%;--s:3px;--d:11s;--dl:-13s;--dx:18px"></span>
    </div>

    <div class="container py-4">

        <!-- Logo + Back to Home -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-2">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                <span class="logo-text">AI Summarizer</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <!-- Dark / Light switch (CSS-only, uses a hidden checkbox) -->
                <input type="checkbox" id="themeSwitch" class="visually-hidden">
                <label for="themeSwitch" class="theme-circle-btn" aria-label="Toggle Theme" title="Dark / Light">
                    <span class="theme-btn-icon"></span>
                </label>
                <a href="index.html" class="btn btn-accent rounded-pill px-4">&larr; Back to Home</a>
            </div>
        </div>

        <div class="row g-4">

            <!-- Input -->
            <div class="col-lg-6">
                <div class="panel h-100 d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="panel-title mb-0">Your Text</h2>
                        <small class="text-muted-custom fw-semibold" id="wordCount">0 words</small>
                    </div>

                    <!-- Single composer: type text and/or attach a file -->
                    <input type="file" id="fileInput" class="visually-hidden" accept=".txt,.pdf,.doc,.docx">

                    <div class="composer flex-grow-1" id="uploadZone">
                        <div class="file-chip d-none" id="fileInfo">
                            <svg class="chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span class="file-name" id="fileName">No file selected</span>
                            <button type="button" class="file-remove" id="removeFileBtn"
                                aria-label="Remove file">&times;</button>
                        </div>

                        <textarea id="inputText" class="composer-text"
                            placeholder="Paste or type your text here, or attach a file..."
                            spellcheck="false"></textarea>

                        <div class="composer-bar">
                            <label for="fileInput" class="attach-btn" title="Attach a file (TXT, PDF, DOCX)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                                    </path>
                                </svg>
                                <span>Attach file</span>
                            </label>
                            <span class="composer-hint">TXT, PDF, DOCX</span>

                            <div class="ms-auto d-flex align-items-center gap-2">
                                <button class="btn btn-ghost btn-sm rounded-pill px-3" id="clearBtn">Clear</button>
                                <button class="btn btn-accent rounded-pill px-4" id="summarizeBtn">Summarize</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Output -->
            <div class="col-lg-6">
                <div class="panel h-100 d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="panel-title mb-0">Summary</h2>
                        <button class="btn btn-ghost btn-sm rounded-pill px-3" id="copyBtn" disabled>Copy</button>
                    </div>

                    <div class="output-box flex-grow-1" id="outputBox">
                        <p class="text-muted-custom m-auto text-center" id="placeholderText">Your summary will appear
                            here.</p>
                    </div>

                    <div class="row g-2 text-center d-none" id="statsRow">
                        <div class="col-4"><div class="mini-stat"><strong id="statOriginal">0</strong><span>Original words</span></div></div>
                        <div class="col-4"><div class="mini-stat"><strong id="statSummary">0</strong><span>Summary words</span></div></div>
                        <div class="col-4"><div class="mini-stat"><strong id="statReduced">0%</strong><span>Reduced</span></div></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
